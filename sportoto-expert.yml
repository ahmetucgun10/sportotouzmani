name: sportoto-expert
on:
  push:
    paths: ["sportoto-expert/**"]
  pull_request:
    paths: ["sportoto-expert/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sportoto-expert
    env:
      DATABASE_URL: postgresql://x:x@localhost:5432/x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: sportoto-expert/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: cargo test --release
        working-directory: sportoto-expert/rust-core
